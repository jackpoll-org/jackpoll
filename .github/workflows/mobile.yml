# Mobile build (issue: mobile app). The apps wrap the live site (Capacitor
# server.url), so no Next build is needed — `cap sync` copies the fallback
# webDir and native projects, then each platform compiles.
#
# Release signing (Apple cert / Android keystore) is intentionally NOT here —
# add it with repository secrets when you set up store accounts (see MOBILE.md).
name: Mobile build

on:
  # Free on public repositories, but only worth running when the native shell
  # changed: web-only changes reach the apps through the instance, not a build.
  push:
    branches: ["master", "main"]
    paths:
      - "apps/frontend/ios/**"
      - "apps/frontend/android/**"
      - "apps/frontend/mobile/**"
      - "apps/frontend/capacitor.config.ts"
      - "apps/frontend/package.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/frontend/ios/**"
      - "apps/frontend/android/**"
      - "apps/frontend/mobile/**"
      - "apps/frontend/capacitor.config.ts"
      - "apps/frontend/package.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/frontend

jobs:
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync android
      - name: Build debug APK
        working-directory: apps/frontend/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: apps/frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync ios
      - name: Build (simulator, unsigned)
        working-directory: apps/frontend/ios/App
        run: |
          xcodebuild \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
