# Unsigned F-Droid ("base") APK release. Runs automatically on every relevant
# commit — no button needed — unlike mobile-release.yml (Play/iOS store
# publishing), which is button-only.
#
# Every run creates a GitHub Release with the APK attached:
#   • push to master        → tag build-<run_number>, marked prerelease (beta).
#   • push of a version tag → tag <the pushed tag>, NOT prerelease.
name: Mobile base APK release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
    paths:
      - "apps/frontend/android/**"
      - "apps/frontend/ios/**"
      - "apps/frontend/capacitor.config.ts"
      - "apps/frontend/package.json"
      - ".github/workflows/mobile-base-release.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/frontend

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Sync web → native
        run: pnpm exec cap sync android

      # FLOSS, no Google; unsigned — F-Droid re-signs it on their end.
      - name: Build F-Droid release APK
        working-directory: apps/frontend/android
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Determine release metadata
        id: relmeta
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Beta build ${{ github.run_number }} ($short_sha)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.relmeta.outputs.tag_name }}
          name: ${{ steps.relmeta.outputs.name }}
          prerelease: ${{ steps.relmeta.outputs.prerelease }}
          generate_release_notes: true
          files: apps/frontend/android/app/build/outputs/apk/fdroid/release/*.apk
          body: |
            Unsigned F-Droid base APK for commit ${{ github.sha }}.

            Matching backend/frontend images (for commits that touch those apps)
            are published to `ghcr.io/${{ github.repository_owner }}/backend`
            and `ghcr.io/${{ github.repository_owner }}/frontend`, tagged
            `sha-${{ steps.relmeta.outputs.short_sha }}` (and `latest` on master).

            Play Store / TestFlight builds are published separately, via the
            button-only "Mobile release" workflow.
