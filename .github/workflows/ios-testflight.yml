# Ship the iOS app to TestFlight straight from the open-source tree (#51).
#
# The point is provenance: the app on the App Store is built from this public
# repository, from a commit anyone can inspect, and every build carries a signed
# GitHub attestation proving it. (The app is a Capacitor shell — it loads the
# instance you point it at, so this guarantees the shell, not what a given
# server serves.)
#
# Runs on every push that touches the native shell. GitHub bills standard
# runners at zero for public repositories, macOS included, so the macOS minutes
# here are free — unlike in the private source repo, where the iOS jobs are
# manual for exactly that reason.
#
# SETUP — repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       App Store Connect API key id
#   ASC_ISSUER_ID    the issuer id above the key table
#   ASC_KEY_CONTENT  base64 of the AuthKey_<id>.p8   (base64 -i AuthKey_X.p8 | pbcopy)
# The key needs the **Admin** role: cloud signing creates the distribution
# certificate and the provisioning profile on the fly, and an App Manager key
# may not do that. Without the secrets the job skips with a warning, so forks
# are unaffected.
name: iOS TestFlight

on:
  push:
    branches: ["master"]
    paths:
      # Only the native shell decides what a new build contains; web changes
      # reach users through the instance without an App Store round trip.
      - "apps/frontend/ios/**"
      - "apps/frontend/mobile/**"
      - "apps/frontend/capacitor.config.ts"
      - "apps/frontend/package.json"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Required by attest-build-provenance to sign the attestation.
  id-token: write
  attestations: write

concurrency:
  # Never cancel a run mid-upload: a half-delivered build wastes the build
  # number and confuses App Store Connect.
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        id: gate
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::warning::ASC_KEY_CONTENT not set — skipping the TestFlight build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Place the App Store Connect API key
        if: steps.gate.outputs.skip == 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # Where both xcodebuild (--authenticationKeyPath) and altool look.
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode \
            > ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"

      - name: Build and upload to TestFlight
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/frontend/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # No Apple ID is signed into Xcode on a runner, so signing has to go
          # through the API key. Needs the Admin role (see the header).
          ASC_CLOUD_SIGNING: '1'
        run: ./release-testflight.sh

      - name: Attest build provenance
        if: steps.gate.outputs.skip == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/frontend/ios/build/export/App.ipa

      - name: Keep the .ipa for inspection
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: jackpoll-ios-ipa
          path: apps/frontend/ios/build/export/App.ipa
          retention-days: 14
