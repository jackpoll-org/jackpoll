# Ship the mobile apps from the open-source tree (#51/#52).
#
# The point is provenance: what lands on the App Store and in Play is built from
# this public repository, from a commit anyone can inspect, and the iOS binary
# carries a signed GitHub attestation. (Both apps are Capacitor shells — they
# load whichever instance you point them at, so this guarantees the shell, not
# what a given server serves.)
#
# Every push that touches the native shell produces one release: a TestFlight
# build handed straight to the public beta group, a Play Console draft, an
# unsigned F-Droid APK, and a GitHub Release holding all three artifacts.
# Web-only changes deliberately trigger nothing — they reach users through the
# instance without a store round trip.
#
# This workflow never submits to the App Store. Only one version can be in
# review at a time and each submission needs release notes someone has read, so
# that step hangs off an `ios-v*` tag in ios-promote.yml instead.
#
# macOS minutes are free here: GitHub bills standard runners at zero for public
# repositories. In the private source repo the iOS jobs are manual for exactly
# that reason.
#
# SETUP — repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_CONTENT
#       App Store Connect API key, base64 for the .p8. Needs the **Admin** role:
#       no Apple ID is signed into a runner, so signing happens through the key,
#       and only Admin may create certificates and profiles.
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
#   ANDROID_KEY_PASSWORD
#       Release keystore for the Play build.
#   PLAY_SERVICE_ACCOUNT_JSON
#       Play service account with "Release apps to testing tracks". Also used to
#       read the highest version code already uploaded.
#
# SETUP — ASC_APP_ID, the numeric App Store Connect app id. Read from either
#       Variables or Secrets, whichever holds it. A *variable* is the better
#       home — the id is in every TestFlight URL anyway, and as a secret it gets
#       masked to *** in logs and step summaries. Unset means iOS builds stay
#       internal-only.
#
# Each job skips with a warning when its secrets are absent, so forks are fine.
name: Mobile release

on:
  push:
    branches: ["master"]
    paths:
      - "apps/frontend/ios/**"
      - "apps/frontend/android/**"
      - "apps/frontend/mobile/**"
      - "apps/frontend/capacitor.config.ts"
      - "apps/frontend/package.json"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  id-token: write # sign the build provenance attestation
  attestations: write

concurrency:
  # Never cancel mid-upload: a half-delivered build burns its number and
  # confuses the stores.
  group: mobile-release
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      build: ${{ steps.build.outputs.number }}
      version: ${{ steps.build.outputs.version }}
      skipped: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        id: gate
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::warning::ASC_KEY_CONTENT not set — skipping the TestFlight build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Place the App Store Connect API key
        if: steps.gate.outputs.skip == 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # Where both xcodebuild and altool look for it.
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode \
            > ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"

      - name: Build and upload to TestFlight
        id: build
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/frontend/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # A runner has no Apple ID in Xcode, so sign through the API key.
          ASC_CLOUD_SIGNING: '1'
        run: |
          # The script asks App Store Connect for the next number in this version
          # train, so local and CI builds share one sequence starting at 1.
          set -o pipefail
          ./release-testflight.sh | tee build.log
          version="$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' App/App.xcodeproj/project.pbxproj | head -1)"
          number="$(sed -n 's/.*build \([0-9]*\), team.*/\1/p' build.log | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # External testers, no manual click. The first build of a version train is
      # looked at by a human in Beta App Review; the ones after it are normally
      # waved through, so a push reaches testers within the hour.
      - name: Hand the build to the public beta
        if: steps.gate.outputs.skip == 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Either place works; a variable keeps it out of the log mask, which
          # makes failures easier to read.
          ASC_APP_ID: ${{ vars.ASC_APP_ID || secrets.ASC_APP_ID }}
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            echo "::warning::ASC_APP_ID not set — the build stays internal-only."
            exit 0
          fi
          pip install --quiet cryptography
          python3 .github/scripts/asc.py beta-add \
            --train "${{ steps.build.outputs.version }}" \
            --build "${{ steps.build.outputs.number }}" \
            --group "Public Beta"

      - name: Attest build provenance
        if: steps.gate.outputs.skip == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/frontend/ios/build/export/App.ipa

      - name: Name the .ipa after its build
        if: steps.gate.outputs.skip == 'false'
        run: |
          mv apps/frontend/ios/build/export/App.ipa \
             "apps/frontend/ios/build/export/jackpoll-${{ steps.build.outputs.version }}-b${{ steps.build.outputs.number }}.ipa"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          name: ios-ipa
          path: apps/frontend/ios/build/export/*.ipa
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      versioncode: ${{ steps.versioncode.outputs.code }}
      skipped: ${{ steps.keystore.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile
      - name: Sync web → native
        working-directory: apps/frontend
        run: pnpm exec cap sync android

      # ── F-Droid flavor (FLOSS, no Google; unsigned — F-Droid re-signs) ──
      - name: Build F-Droid release APK
        working-directory: apps/frontend/android
        run: ./gradlew assembleFdroidRelease --no-daemon

      # ── Play flavor (signed AAB) ──
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — skipping the signed Play AAB."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Next Play version code
        id: versioncode
        if: steps.keystore.outputs.skip == 'false'
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set — using the run number."
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install --quiet google-auth requests
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          # Play rejects any version code that is not strictly higher than every
          # code ever uploaded, drafts included — so ask the store rather than
          # counting CI runs. (This is why Android cannot restart at 1 the way a
          # fresh iOS version train can.)
          python3 "$GITHUB_WORKSPACE/.github/scripts/next-play-version-code.py" \
            "$RUNNER_TEMP/sa.json" de.quavon.jackpoll >> "$GITHUB_OUTPUT"

      - name: Build signed Play AAB
        if: steps.keystore.outputs.skip == 'false'
        working-directory: apps/frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.versioncode.outputs.code }}
        run: ./gradlew bundlePlayRelease --no-daemon

      # Uploaded as a DRAFT: promote it in the console when you want it live.
      - name: Upload to Play Console (open testing, draft)
        if: steps.keystore.outputs.skip == 'false'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.quavon.jackpoll
          releaseFiles: apps/frontend/android/app/build/outputs/bundle/playRelease/*.aab
          track: beta
          status: draft

      - name: Collect artifacts
        run: |
          mkdir -p out
          for apk in apps/frontend/android/app/build/outputs/apk/fdroid/release/*.apk; do
            [ -e "$apk" ] && cp "$apk" "out/jackpoll-fdroid-vc${{ steps.versioncode.outputs.code }}.apk"
          done
          for aab in apps/frontend/android/app/build/outputs/bundle/playRelease/*.aab; do
            [ -e "$aab" ] && cp "$aab" "out/jackpoll-play-vc${{ steps.versioncode.outputs.code }}.aab"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: out/*
          retention-days: 30

  # One release per push, holding every store artifact of that build. A failed
  # Play upload must not swallow a successful iOS build, so this runs on the iOS
  # result and attaches whatever artifacts exist.
  release:
    needs: [ios, android]
    if: always() && needs.ios.result == 'success' && needs.ios.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mobile-b${{ needs.ios.outputs.build }}
          VERSION: ${{ needs.ios.outputs.version }}
          BUILD: ${{ needs.ios.outputs.build }}
          VC: ${{ needs.android.outputs.versioncode }}
        run: |
          find artifacts -type f | sort
          cat > notes.md <<EOF
          Built from \`$GITHUB_SHA\` by the \`Mobile release\` workflow.

          | Artifact | Where it went |
          |---|---|
          | \`.ipa\` | TestFlight — iOS $VERSION, build $BUILD |
          | \`.aab\` | Play Console beta track, draft — versionCode $VC |
          | \`.apk\` | F-Droid flavor, unsigned (F-Droid signs it) |

          Verify the iOS binary was built from this repository:

          \`\`\`
          gh attestation verify <file>.ipa --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mobile $VERSION (build $BUILD)" \
            --notes-file notes.md \
            $(find artifacts -type f)
