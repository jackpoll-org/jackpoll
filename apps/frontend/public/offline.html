<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Jackpoll</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f7f7fb; color: #1c1c28; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #14141b; color: #ececf1; } }
      .card { max-width: 28rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { color: #6b6b7b; margin: 0 0 1.25rem; line-height: 1.5; }
      button {
        font: inherit; border: 0; border-radius: .625rem; padding: .625rem 1.25rem;
        background: #6d5ce7; color: #fff; cursor: pointer;
      }
      img { width: 72px; height: 72px; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>This page needs a connection. Surveys you've already opened still work
        offline, and any answers you submit will sync once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
