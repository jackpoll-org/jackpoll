# F-Droid build metadata for https://gitlab.com/fdroid/fdroiddata
# Submit by copying this file to metadata/de.quavon.jackpoll.yml there and
# opening a merge request (see README.md next to this file).
#
# Jackpoll's mobile app is a Capacitor shell: Node (Debian forky) + pnpm run
# `cap sync` before Gradle. Only the "fdroid" flavor is built. It contains no Google Play Services
# or Firebase: Android push goes through UnifiedPush (e.g. ntfy), and the
# FCM-based @capacitor/push-notifications plugin is excluded from Android in
# capacitor.config.ts. Verified with `fdroid scanner` on source and APK.
#
# Reproducible build: fdroid-verify.yml builds each v* tag with F-Droid's own
# image, signs it with our key and attaches it to the GitHub Release; F-Droid
# checks its build against that APK (Binaries) signed with the key below.

Categories:
  - Internet
  - Science & Education
License: MIT
AuthorName: Quavon Development
AuthorEmail: contact@quavon.de
WebSite: https://jackpoll.org
SourceCode: https://github.com/jackpoll-org/jackpoll
IssueTracker: https://github.com/jackpoll-org/jackpoll/issues

AutoName: Jackpoll

RepoType: git
Repo: https://github.com/jackpoll-org/jackpoll.git
Binaries: https://github.com/jackpoll-org/jackpoll/releases/download/v%v/jackpoll-%v.apk

Builds:
  - versionName: 1.0.3
    versionCode: 4
    commit: v1.0.3
    subdir: apps/frontend/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
      - npm install -g pnpm@11.4.0
    gradle:
      - fdroid
    prebuild:
      - cd ../..
      - pnpm install --frozen-lockfile --ignore-scripts --store-dir /tmp/pnpm-store
      - pnpm exec cap sync android
    scandelete:
      - apps/frontend/node_modules/

AllowedAPKSigningKeys: 879d9185bb491834aea31c81c7f29308c317ea255920bb778947378c33974998

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.3
CurrentVersionCode: 4
