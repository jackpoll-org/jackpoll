apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "de.quavon.jackpoll"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.quavon.jackpoll"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play requires a strictly increasing versionCode per upload. CI sets
        // ANDROID_VERSION_CODE (from the GitHub Actions run number); local/dev
        // builds fall back to 1.
        versionCode (System.getenv("ANDROID_VERSION_CODE") ? System.getenv("ANDROID_VERSION_CODE").toInteger() : 1)
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing (#52). Driven by env so the keystore never lives in the
    // repo; when unset (dev / unsigned CI builds) the release stays unsigned.
    signingConfigs {
        release {
            def storePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    // ── Push distribution flavors (UnifiedPush) ───────────────────────────
    //   play   → Google Play build. May bundle the Embedded FCM distributor as
    //            a fallback when no external distributor is installed.
    //   fdroid → 100% FLOSS build. NO Google Play Services / FCM of any kind;
    //            relies on an external distributor (ntfy, NextPush, …).
    flavorDimensions += "dist"
    productFlavors {
        play {
            dimension "dist"
            buildConfigField "boolean", "EMBEDDED_FCM", "true"
        }
        fdroid {
            dimension "dist"
            buildConfigField "boolean", "EMBEDDED_FCM", "false"
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// UnifiedPush versions — pin to the current releases before building:
//   connector:            https://central.sonatype.com/artifact/org.unifiedpush.android/connector
//   embedded FCM distrib: https://github.com/UnifiedPush/android-embedded_fcm_distributor
ext.unifiedPushConnector = "3.0.10"
ext.unifiedPushEmbeddedFcm = "3.0.0"

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // UnifiedPush connector — used by BOTH flavors (FLOSS, no Google deps).
    implementation "org.unifiedpush.android:connector:$unifiedPushConnector"

    // Play flavor ONLY: bundled FCM distributor fallback. This is the only place
    // Google Play Services enter the app, and it never ships in the fdroid build.
    playImplementation "org.unifiedpush.android:embedded-fcm-distributor:$unifiedPushEmbeddedFcm"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Apply the Google Services plugin ONLY when building a "play" variant, and only
// if a google-services.json is present (src/play/ or app/). This keeps the
// fdroid flavor 100% free of Google: for any fdroid/other task the plugin is
// never applied, so no google-services.json is required and none is bundled.
def isPlayTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("play") }
def hasGoogleServices = file("src/play/google-services.json").exists() || file("google-services.json").exists()
if (isPlayTask && hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else if (isPlayTask) {
    logger.warn("google-services.json missing — the play flavor's Embedded FCM push will not work until you add it (src/play/google-services.json).")
}
