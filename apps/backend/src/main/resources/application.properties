# ── PostgreSQL ────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:survey}
# Secret: no production default — a real deployment MUST set DB_PASSWORD or the
# app refuses to boot rather than silently using a guessable credential. Local
# dev/test keep a convenience value via the profile overrides below.
quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.password=${DB_PASSWORD:survey}
%test.quarkus.datasource.password=${DB_PASSWORD:survey}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:survey}

# ── Schema management (issue #41) ─────────────────────────────────
# Production/staging: Flyway owns the schema; Hibernate only VALIDATES and
# refuses to boot on a mismatch. Dev/test recreate fast from the entities.
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.flyway.migrate-at-start=true
# Databases created before Flyway are baselined at V1 (not re-run), so we never
# try to recreate live tables.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
%dev.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.migrate-at-start=false

quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true
# Use a dedicated FormatMapper for JSON columns (jsonb) instead of the REST
# ObjectMapper, which is customized (write-dates-as-timestamps=false).
quarkus.hibernate-orm.mapping.format.global=ignore

# ── HTTP ──────────────────────────────────────────────────────────
quarkus.http.port=${HTTP_PORT:8080}
quarkus.rest.path=/api/v1
# Allow image uploads up to 10 MB through the multipart body reader.
quarkus.http.limits.max-body-size=10M

# ── Object storage (MinIO / S3) ───────────────────────────────────
# Internal MinIO endpoint. The browser never reaches this host directly; images
# are streamed through the upload proxy (GET /uploads/raw), so an internal
# cluster address (e.g. http://minio:9000) is fine here.
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
# Secret: no production default (see DB_PASSWORD note). Dev/test fall back to the
# well-known MinIO dev credential; production must set MINIO_SECRET_KEY.
minio.secret-key=${MINIO_SECRET_KEY}
%dev.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
%test.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:survey-uploads}
# Max upload size in bytes (10 MB).
minio.max-file-size=${MINIO_MAX_FILE_SIZE:10485760}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
quarkus.http.cors.headers=${CORS_HEADERS:Authorization,Content-Type}
quarkus.http.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Set-Cookie}
quarkus.http.cors.access-control-allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# ── OIDC / Keycloak ──────────────────────────────────────────────
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:survey-school}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:survey-backend}
# Secret: no production default (see DB_PASSWORD note). Dev/test fall back to the
# Keycloak dev client secret; production must set KEYCLOAK_CLIENT_SECRET.
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
%dev.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:secret}
%test.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:secret}
# Bearer token validation for API requests
quarkus.oidc.application-type=service
# Allow @PermitAll endpoints to accept unauthenticated requests
quarkus.http.auth.permission.permit-all.paths=/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/forgot-password,/api/v1/auth/verify-email,/api/v1/auth/resend-verification,/api/v1/auth/reset-password,/api/v1/auth/oidc-config,/api/v1/auth/logout,/api/v1/auth/delete-account/request,/api/v1/auth/delete-account/confirm,/api/v1/auth/delete-data/request,/api/v1/auth/delete-data/confirm
quarkus.http.auth.permission.permit-all.policy=permit

# Keycloak admin (for user management operations)
keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:survey-school}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
# Secrets: no production defaults (see DB_PASSWORD note). Production must set
# KEYCLOAK_ADMIN_PASSWORD and KEYCLOAK_CLIENT_SECRET; dev/test fall back below.
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
%dev.keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
%test.keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:survey-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
%dev.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:secret}
%test.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:secret}

# ── Keycloak REST Clients ─────────────────────────────────────────
quarkus.rest-client.keycloak-token-client.url=${KEYCLOAK_URL:http://localhost:8180}
quarkus.rest-client.keycloak-admin-client.url=${KEYCLOAK_URL:http://localhost:8180}

# App base URL (for Keycloak email links).
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Require new users to confirm their email before they can sign in. Default true
# (secure). Self-host instances WITHOUT a mail provider can set this to false so
# registration works without sending a verification code — see the security note
# in the self-hosting docs. Also surfaced to the frontend via GET /auth/oidc-config.
app.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:true}

# Debug/diagnostics tools (test-push + test-email endpoints and the Settings →
# Debug page). Default true (handy for self-host). Set false on the official
# hosted instance so end users don't see technical diagnostics.
app.debug-tools-enabled=${DEBUG_TOOLS_ENABLED:true}


# Save & Resume drafts (issue #26): how long an in-progress draft lives.
survey.draft.ttl-days=${SURVEY_DRAFT_TTL_DAYS:30}

# Spam & bot protection (issue #31)
# Secret: signs begin-tokens / Altcha challenges. No production default (see
# DB_PASSWORD note); production must set SURVEY_SPAM_SECRET.
survey.spam.secret=${SURVEY_SPAM_SECRET}
%dev.survey.spam.secret=${SURVEY_SPAM_SECRET:change-me-spam-secret}
%test.survey.spam.secret=${SURVEY_SPAM_SECRET:change-me-spam-secret}
survey.spam.rate-limit.max=${SURVEY_SPAM_RATE_LIMIT_MAX:5}
survey.spam.rate-limit.window-seconds=${SURVEY_SPAM_RATE_LIMIT_WINDOW:60}

# Brute-force guard for auth endpoints (#56) — per IP and per account, uses the
# same limiter backend as #42 (memory or redis).
survey.auth.rate-limit.max=${AUTH_RATE_LIMIT_MAX:10}
survey.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW:300}
# Effectively off for the shared-JVM test suite (AuthRateLimitTest overrides it).
%test.survey.auth.rate-limit.max=100000

# Throttle the anonymous upload endpoint per client IP (storage-abuse guard).
survey.upload.rate-limit.max=${UPLOAD_RATE_LIMIT_MAX:20}
survey.upload.rate-limit.window-seconds=${UPLOAD_RATE_LIMIT_WINDOW:60}
# Effectively off for the shared-JVM test suite.
%test.survey.upload.rate-limit.max=100000

# Optional upload virus scanning (issue #43) via a clamd sidecar. Disabled by
# default; content-type sniffing always runs. fail-open=false rejects uploads
# when clamd is unreachable (set true to accept instead).
survey.upload.clamav.enabled=${CLAMAV_ENABLED:false}
survey.upload.clamav.host=${CLAMAV_HOST:localhost}
survey.upload.clamav.port=${CLAMAV_PORT:3310}
survey.upload.clamav.fail-open=${CLAMAV_FAIL_OPEN:false}

# Push notifications — Web Push (VAPID), the single channel for browsers AND the
# mobile app (Android registers via UnifiedPush, whose distributor yields a Web
# Push endpoint). Generate a key pair once with `web-push generate-vapid-keys`
# (npm) or any VAPID tool, then provide the base64url keys below. Without them,
# subscriptions register but nothing is sent. The public key is exposed to the
# frontend via GET /me/devices/web-push-key.
survey.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
survey.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
survey.push.vapid.subject=${VAPID_SUBJECT:mailto:admin@jackpoll.app}

# Distributed rate limiting (issue #42). "memory" = per-instance (default);
# "redis" = shared across instances via the configured Redis client.
survey.rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
# Never auto-start a Redis container for dev/test; the memory backend is used.
quarkus.redis.devservices.enabled=false
# Redis is optional (only used when the backend is "redis"), so its health
# check must not fail readiness when running with the memory backend.
quarkus.redis.health.enabled=false

# Refresh-token cookie (issue #35) — Secure over HTTPS; off for http://localhost dev.
survey.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
%dev.survey.auth.cookie-secure=false

# Outbound webhooks (issue #36). allow-private blocks SSRF to internal/loopback
# addresses in prod; enabled for dev/test so local endpoints can be used.
survey.webhook.allow-private=${WEBHOOK_ALLOW_PRIVATE:false}
%dev.survey.webhook.allow-private=true
%test.survey.webhook.allow-private=true
survey.webhook.timeout-seconds=${WEBHOOK_TIMEOUT_SECONDS:10}

# Email notifications & receipts (issue #24). Dev/default = Mailpit (SMTP :1025,
# no auth/TLS). For production (#48) point MAIL_HOST at a real SMTP server and
# set MAIL_USERNAME / MAIL_PASSWORD / MAIL_TLS (e.g. REQUIRED for port 587).
quarkus.mailer.from=${MAIL_FROM:Survey School <noreply@surveyschool.test>}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
# DISABLED (dev) | OPTIONAL | REQUIRED (STARTTLS, port 587).
quarkus.mailer.start-tls=${MAIL_TLS:DISABLED}
quarkus.mailer.mock=${MAIL_MOCK:false}
# Use the mock mailbox in tests instead of a live SMTP server.
%test.quarkus.mailer.mock=true
%test.quarkus.scheduler.enabled=false
# Send synchronously in tests so the mock mailbox is deterministic.
%test.survey.mail.async=false
survey.mail.subject-prefix=${MAIL_SUBJECT_PREFIX:[Survey School]}
survey.mail.app-url=${APP_BASE_URL:http://localhost:3000}

# ── Email verification & password-reset codes (#security email-verify) ──
# 6-digit single-use codes emailed via the mailer above (not Keycloak SMTP).
# EMAIL_CODE_SECRET signs the at-rest hash — set a strong value in production.
survey.auth.email-code.ttl-minutes=${EMAIL_CODE_TTL_MINUTES:15}
survey.auth.email-code.max-attempts=${EMAIL_CODE_MAX_ATTEMPTS:5}
survey.auth.email-code.secret=${EMAIL_CODE_SECRET:change-me-email-code-secret}

