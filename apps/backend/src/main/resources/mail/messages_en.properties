reset.note=If you did not request this, you can ignore this email — your password stays unchanged.
reset.footer=You get this email because a password reset was requested for this address.

# ── Delete account code ───────────────────────────────────────────
deleteaccount.subject=Confirm account deletion: {0}
deleteaccount.preheader=Confirmation code for deleting your account: {0}.
deleteaccount.heading=Confirm account deletion
deleteaccount.body=We received a request to permanently delete your Jackpoll account. Your confirmation code is:
