deleteaccount.muted=If you did not request this, you can ignore this email — your account stays unchanged.
deleteaccount.footer=You get this email because account deletion was requested for this address.

# ── Delete data code ──────────────────────────────────────────────
deletedata.subject=Confirm data deletion: {0}
deletedata.preheader=Confirmation code for deleting your data: {0}.
deletedata.heading=Confirm data deletion
deletedata.body=We received a request to delete the data in your Jackpoll account. Your confirmation code is:
